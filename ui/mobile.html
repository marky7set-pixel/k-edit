<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a15">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:">
<title>K-Edit · ادیت کلید</title>
<link rel="icon" href="img/kedit-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mob.css">
</head>
<body class="mob">
<div class="amb"></div>

<!-- home -->
<section class="scr on" id="home">
  <div class="home-hero">
    <img class="home-logo" src="img/kedit-icon.png" alt="">
    <h1 class="goldtxt">K-Edit</h1>
    <p>ادیت کلید | عکس و ویدیو</p>
  </div>
  <div class="home-cards">
    <button class="hcard" id="goImg"><span class="hc-ic" data-ic="img"></span><span class="hc-tx"><b>عکس</b><small>برش، افکت، هوش مصنوعی</small></span><span class="hc-go" data-ic="prev"></span></button>
    <button class="hcard" id="goVid"><span class="hc-ic" data-ic="vid"></span><span class="hc-tx"><b>ویدیو</b><small>کات، کادر، افکت | MP4، GIF</small></span><span class="hc-go" data-ic="prev"></span></button>
  </div>
  <p class="home-foot">کیفیت می‌ماند، حجم می‌رود | نسخهٔ <span id="ver"></span></p>
</section>

<!-- image editor -->
<section class="scr ed" id="edImg" data-kind="img" data-tool="crop">
  <div class="tb"><button class="ibtn bk glass" data-back data-ic="back" aria-label="بازگشت"></button><button class="ibtn bk glass" data-repick data-ic="open" aria-label="عکس دیگر"></button><div class="fn"><bdi data-el="name"></bdi><small data-el="infoS"></small></div><button class="go sv" data-act="export"><span data-ic="spark"></span><span>ساخت</span></button></div>
  <span class="sr"><small data-el="info"></small></span>
  <div class="stage" data-el="stage"><div class="frame" data-el="frame"><canvas data-el="canvas"></canvas><div class="crop" data-el="crop"></div></div>
    <button class="cmp ibtn glass" data-act="compare" data-ic="eye" aria-label="نگه دارید: عکس اصلی"></button></div>
  <div class="ir"><button class="ibtn glass ur" data-act="undo" data-ic="undo" aria-label="برگشت به تغییر قبلی" disabled></button><div class="mid"><div class="lc glass"><span data-el="outS">—</span><i></i><b data-el="dPct">—</b><i></i><span data-el="rTxt">—</span><i></i><span data-el="etaS">—</span></div></div><button class="ibtn glass ur" data-act="redo" data-ic="redo" aria-label="رفتن به تغییر بعدی" disabled></button></div>
  <div class="dws">
    <div class="dw glass" data-pane="crop"><div class="dh"><b>برش و چرخش</b><span class="dh-a"><button class="link" data-act="stepReset">بازنشانی</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll"><button class="chip sel" data-aspect="free">آزاد</button><button class="chip" data-aspect="orig">اصلی</button><button class="chip" data-aspect="1:1">۱:۱</button><button class="chip" data-aspect="4:5">۴:۵</button><button class="chip" data-aspect="4:3">۴:۳</button><button class="chip" data-aspect="3:2">۳:۲</button><button class="chip" data-aspect="16:9">۱۶:۹</button><button class="chip" data-aspect="9:16">۹:۱۶</button></div><div class="ic4"><button class="ibtn" data-act="rotr" data-ic="rotr" aria-label="چرخش به راست"></button><button class="ibtn" data-act="rotl" data-ic="rotl" aria-label="چرخش به چپ"></button><button class="ibtn" data-act="fliph" data-ic="fliph" aria-label="آینه افقی"></button><button class="ibtn" data-act="flipv" data-ic="flipv" aria-label="آینه عمودی"></button></div></div>
    <div class="dw glass" data-pane="adj"><div class="dh"><b>نور و رنگ</b><span class="dh-a"><button class="link" data-act="stepReset">بازنشانی</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="sl"><label>روشنایی</label><input type="range" min="50" max="150" value="100" data-k="bright"><output data-v="bright">۰</output></div><div class="sl"><label>کنتراست</label><input type="range" min="50" max="150" value="100" data-k="contrast"><output data-v="contrast">۰</output></div><div class="sl"><label>اشباع</label><input type="range" min="0" max="200" value="100" data-k="sat"><output data-v="sat">۰</output></div><button class="link" hidden data-act="resetAdj">بازنشانی</button></div>
    <div class="dw glass" data-pane="fx"><div class="dh"><b>افکت <small data-el="fxName">بدون افکت</small></b><span class="dh-a"><button class="link" data-act="stepReset">بازنشانی</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll fxrow" data-el="fxstrip"></div><div class="sl fx-k"><label>شدت</label><input type="range" min="0" max="100" value="50" data-k="fxk"><output data-v="fxk">۵۰</output></div></div>
    <div class="dw glass" data-pane="out">
      <div class="sub on" data-s=""><div class="dh"><b>خروجی</b><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="opts"><button class="ob" data-sub="fmt"><small>قالب</small><b data-el="vFmt">—</b></button><button class="ob" data-sub="q"><small>کیفیت</small><b data-el="vQ">—</b></button><button class="ob" data-sub="res"><small>وضوح</small><b data-el="vRes">—</b></button><button class="ob ai" data-sub="ai"><small>هوش مصنوعی</small><b data-el="vAi">—</b></button></div><button class="sw" data-act="keep" role="switch" aria-checked="false"><span>وضوح هیچ‌وقت کم نشود</span><i></i></button></div>
      <div class="sub" data-s="fmt"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>قالب</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="fmts c4"><button class="fmt" data-ifmt="avif"><b>AVIF</b></button><button class="fmt sel" data-ifmt="webp"><b>WebP</b></button><button class="fmt" data-ifmt="jpg"><b>JPG</b></button><button class="fmt" data-ifmt="png"><b>PNG</b></button></div><span class="ailine sm" data-el="fmtNote"></span></div>
      <div class="sub" data-s="q"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>کیفیت</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="segc no-png"><button class="chip sel" data-qm="smart">هوشمند</button><button class="chip" data-qm="lossless">بی‌افت</button><button class="chip" data-qm="manual">دستی</button></div><div class="sl qm-manual-only no-png"><label>کیفیت</label><input type="range" min="40" max="99" value="85" data-k="q"><output data-v="q">۸۵</output></div><p class="note png-only"><span class="dot"></span>PNG همیشه بی‌افت است</p></div>
      <div class="sub" data-s="res"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>وضوح</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll" data-el="resSec"><button class="chip sel" data-res="0">اصلی</button><button class="chip" data-res="480">480p</button><button class="chip" data-res="720">720p</button><button class="chip" data-res="1080">1080p</button><button class="chip" data-res="1440">2K</button><button class="chip" data-res="2160">4K</button></div><span class="ailine"><i></i><span data-el="resNote"></span></span></div>
      <div class="sub" data-s="ai"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>هوش مصنوعی</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="segc s5"><button class="chip sel" data-up="0">خاموش</button><button class="chip" data-up="1">بهبود</button><button class="chip" data-up="2">۲×</button><button class="chip" data-up="3">۳×</button><button class="chip" data-up="4">۴×</button></div><div class="segc"><button class="chip" data-ais="soft">طبیعی</button><button class="chip sel" data-ais="mid">متعادل</button><button class="chip" data-ais="strong">قوی</button></div><span class="ailine"><i></i><span data-el="upNote">هوش مصنوعی جزئیات تازه می‌سازد</span></span></div>
    </div>
  </div>
  <nav class="bar glass"><button class="tl2" data-tab="crop" data-title="برش و چرخش"><span data-ic="crop"></span>برش</button><button class="tl2" data-tab="adj" data-title="نور و رنگ"><span data-ic="drop"></span>رنگ</button><button class="tl2" data-tab="fx" data-title="افکت"><span data-ic="wand"></span>افکت</button><button class="tl2" data-tab="out" data-title="خروجی"><span data-ic="out"></span>خروجی</button></nav>
</section>

<!-- video editor -->
<section class="scr ed" id="edVid" data-kind="vid" data-tool="cut">
  <div class="tb"><button class="ibtn bk glass" data-back data-ic="back" aria-label="بازگشت"></button><button class="ibtn bk glass" data-repick data-ic="open" aria-label="ویدیوی دیگر"></button><div class="fn"><bdi data-el="name"></bdi><small data-el="infoS"></small></div><button class="go sv" data-act="export"><span data-ic="spark"></span><span>ساخت</span></button></div>
  <span class="sr"><small data-el="info"></small><b data-el="tLen"></b><span data-el="outS"></span><span data-el="rTxt"></span></span>
  <div class="stage" data-el="stage"><div class="frame" data-el="frame"><video data-el="video" muted playsinline></video><canvas class="fxcv" data-el="fxcv" hidden></canvas><div class="crop" data-el="crop"></div></div></div>
  <div class="ir"><button class="ibtn glass ur" data-act="undo" data-ic="undo" aria-label="برگشت به تغییر قبلی" disabled></button><div class="mid"><button class="lc glass pp" data-act="play" aria-label="پخش"><span class="i-play" data-ic="play"></span><span class="i-pause" data-ic="pause"></span><bdi dir="ltr"><span data-el="tCur">—</span> / <span data-el="tDur">—</span></bdi></button><button class="lc glass spb" data-act="speedNext" aria-label="سرعت پخش"><span data-ic="speed"></span><b data-el="vSpd">۱×</b></button><div class="lc glass"><b data-el="dPct">—</b></div></div><button class="ibtn glass ur" data-act="redo" data-ic="redo" aria-label="رفتن به تغییر بعدی" disabled></button></div>
  <div class="dws">
    <div class="dw glass" data-pane="cut"><div class="dh"><b>کات <small><span data-el="tA">—</span> تا <span data-el="tB">—</span></small></b><span class="dh-a"><button class="link" data-act="resetTrim">کل ویدیو</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="trim" data-el="trim"></div><div class="se"><button class="pill" data-act="setA"><span data-ic="start"></span>شروع اینجا</button><span class="m"><button class="ibtn" data-act="stepB" data-ic="prev" aria-label="فریم عقب"></button><button class="ibtn" data-act="stepF" data-ic="next" aria-label="فریم جلو"></button></span><button class="pill" data-act="setB">پایان اینجا<span data-ic="end"></span></button></div></div>
    <div class="dw glass" data-pane="crop"><div class="dh"><b>کادر</b><span class="dh-a"><button class="link" data-act="stepReset">بازنشانی</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll"><button class="chip sel" data-aspect="free">آزاد</button><button class="chip" data-aspect="orig">اصلی</button><button class="chip" data-aspect="1:1">۱:۱</button><button class="chip" data-aspect="4:5">۴:۵</button><button class="chip" data-aspect="4:3">۴:۳</button><button class="chip" data-aspect="3:2">۳:۲</button><button class="chip" data-aspect="16:9">۱۶:۹</button><button class="chip" data-aspect="9:16">۹:۱۶</button></div></div>
    <div class="dw glass" data-pane="fx"><div class="dh"><b>افکت <small data-el="fxName">بدون افکت</small></b><span class="dh-a"><button class="link" data-act="stepReset">بازنشانی</button><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll fxrow" data-el="fxstrip"></div><div class="sl fx-k"><label>شدت</label><input type="range" min="0" max="100" value="50" data-k="fxk"><output data-v="fxk">۵۰</output></div></div>
    <div class="dw glass" data-pane="out">
      <div class="sub on" data-s=""><div class="dh"><b>خروجی</b><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="opts"><button class="ob" data-sub="fmt"><small>قالب</small><b data-el="vFmt">—</b></button><button class="ob" data-sub="res"><small>وضوح</small><b data-el="vRes">—</b></button><button class="ob" data-sub="q"><small>کیفیت</small><b data-el="vQ">—</b></button><button class="ob" data-sub="fps"><small>فریم</small><b data-el="vFps">—</b></button></div><div class="row tgl"><button class="chip sel" data-act="sound" aria-pressed="true"><span data-ic="sound"></span>با صدا</button><button class="chip sel" data-act="loop" aria-pressed="true"><span data-ic="loop"></span>تکرار</button><span class="ailine sm" data-el="fmtNote"></span><span class="frm" data-el="frames">—</span></div></div>
      <div class="sub" data-s="fmt"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>قالب</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="fmts c4"><button class="fmt sel" data-fmt="mp4"><b>MP4</b></button><button class="fmt" data-fmt="webm"><b>WebM</b></button><button class="fmt" data-fmt="webp"><b>WebP</b></button><button class="fmt" data-fmt="gif"><b>GIF</b></button></div></div>
      <div class="sub" data-s="res"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>وضوح</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row scroll"><button class="chip" data-res="360">360p</button><button class="chip sel" data-res="480">480p</button><button class="chip" data-res="720">720p</button><button class="chip" data-res="1080">1080p</button><button class="chip" data-res="0">اصلی</button></div></div>
      <div class="sub" data-s="q"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>کیفیت</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="segc"><button class="chip" data-gq="best">عالی</button><button class="chip sel" data-gq="balanced">متعادل</button><button class="chip" data-gq="small">کم‌حجم</button></div></div>
      <div class="sub" data-s="fps"><div class="dh"><button class="dbk" data-sub=""><span data-ic="back"></span>فریم در ثانیه</button><span class="dh-a"><button class="ok" data-act="close" aria-label="تأیید و بستن">✓</button></span></div><div class="row" data-el="fpsBox"></div></div>
    </div>
  </div>
  <nav class="bar glass"><button class="tl2" data-tab="cut" data-title="کات"><span data-ic="cut"></span>کات</button><button class="tl2" data-tab="crop" data-title="کادر"><span data-ic="crop"></span>کادر</button><button class="tl2" data-tab="fx" data-title="افکت"><span data-ic="wand"></span>افکت</button><button class="tl2" data-tab="out" data-title="خروجی"><span data-ic="out"></span>خروجی</button></nav>
</section>

<!-- result -->
<section class="scr" id="res">
  <div class="res-prev stage" id="resPrev"><img id="resImg" alt=""><video id="resVid" controls playsinline hidden></video><div class="cmpv" id="cmpv" hidden></div></div>
  <div class="res-head glass"><b class="bar-t" id="resTitle">نتیجه</b><span class="sr"><span class="status" id="resStat">آماده</span></span></div>
  <div class="res-info glass" id="resInfoBox" hidden><div class="ri-h"><b>جزئیات فایل</b><button class="ibtn rb x" id="resInfoX" data-ic="close" aria-label="بستن"></button></div><div class="cmpt" id="resTable"></div></div>
  <div class="res-acts fbar glass"><button class="fb" data-back><span data-ic="back"></span>بازگشت</button><button class="fb" id="resInfo"><span data-ic="info"></span>جزئیات</button><button class="fb" id="resShare"><span data-ic="share"></span>اشتراک</button><button class="fb gold" id="resSave"><span><b class="i-sv" data-ic="save"></b><b class="i-ok">✓</b></span><em id="resSaveT">ذخیره در گالری</em></button></div>
</section>

<div class="busy kb" id="busy"><div class="amb"></div><div class="kb-in glass"><div class="kb-t"><span id="busyT">لطفاً صبر کنید</span><small id="busyM" hidden></small></div><div class="pa" aria-hidden="true"><div class="pa-in">
    <i class="pa-sh"></i><i class="pa-sp a"></i><i class="pa-sp b"></i><i class="pa-sp c"></i><i class="pa-sp d"></i>
    <div class="pa-pan"><i class="pa-cake"></i><svg viewBox="0 0 220 150"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d1"/><stop offset=".5" stop-color="#f1cb83"/><stop offset="1" stop-color="#c99e4c"/></linearGradient></defs>
      <path d="M94 106 H184 Q182 122 166 123 H112 Q96 122 94 106 Z" fill="url(#gg)"/><path d="M96 108 Q72 100 46 104" fill="none" stroke="url(#gg)" stroke-width="5.5" stroke-linecap="round"/></svg></div>
    <b class="pa-ok">✓</b></div></div><div class="kb-p goldtxt" id="ringP">۰٪</div><div class="kb-bar" id="ring"><i></i></div><div class="kb-s" id="busyS" hidden><span class="dot"></span><span id="busySt"></span></div><button class="pill" id="busyX" hidden><span data-ic="close"></span><span>لغو</span></button></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fVid" accept="video/*" hidden>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/awebp.js"></script>
<script src="js/demux.js"></script>
<script src="js/media.js"></script>
<script src="js/upscale.js"></script>
<script src="js/compare.js"></script>
<script src="js/editors.js"></script>
<script src="js/ui.js"></script>
<script src="js/mob.js"></script>
</body>
</html>
