<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a15">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:">
<title>K-Edit · ادیت کلید</title>
<link rel="icon" href="img/kedit-icon.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/mob.css">
<link rel="stylesheet" href="css/dock.css">
</head>
<body class="mob">
<div class="amb"></div>

<!-- home -->
<section class="scr on" id="home">
  <div class="home-hero">
    <img class="home-logo" src="img/kedit-icon.png" alt="">
    <h1 class="goldtxt">K-Edit</h1>
    <p>ادیت کلید | عکس و ویدیو</p>
  </div>
  <div class="home-cards">
    <button class="hcard" id="goImg"><span class="hc-ic" data-ic="img"></span><span class="hc-tx"><b>عکس</b><small>برش، افکت، ارتقا | AVIF، WebP، JPG</small></span><span class="hc-go" data-ic="prev"></span></button>
    <button class="hcard" id="goVid"><span class="hc-ic" data-ic="vid"></span><span class="hc-tx"><b>ویدیو</b><small>کادر و زمان | MP4، WebM، GIF</small></span><span class="hc-go" data-ic="prev"></span></button>
  </div>
  <p class="home-foot">کیفیت می‌ماند، حجم می‌رود | نسخهٔ <span id="ver"></span></p>
</section>

<!-- image editor -->
<section class="scr ed" id="edImg" data-kind="img" data-tool="crop">
  <div class="topo"><button class="ibtn glass bk" data-back data-ic="back" aria-label="بازگشت"></button><div class="fileline glass"><b data-el="name"></b><small data-el="info"></small></div><button class="ibtn glass bk" data-repick data-ic="open" aria-label="عکس دیگر"></button></div>
  <div class="stage" data-el="stage"><div class="frame" data-el="frame"><canvas data-el="canvas"></canvas><div class="crop" data-el="crop"></div></div>
    <button class="cmp ibtn glass" data-act="compare" data-ic="eye" aria-label="نگه دارید: عکس اصلی"></button></div>
  <div class="ctl glass">
    <div class="ch"><b class="ch-t"><span class="ch-n">برش و چرخش</span><small class="only-fx" data-el="fxName">بدون افکت</small></b><span class="ch-e"><em data-el="outSize">—</em><span class="only-out"> | <span data-el="dPct"></span></span> | <span class="tm" data-el="eta"><i>—</i></span></span></div>
    <div class="panel">
      <div class="pane on" data-pane="crop">
        <div class="row scroll"><button class="chip sel" data-aspect="free">آزاد</button><button class="chip" data-aspect="orig">اصلی</button><button class="chip" data-aspect="1:1">۱:۱</button><button class="chip" data-aspect="4:5">۴:۵</button><button class="chip" data-aspect="9:16">۹:۱۶</button><button class="chip" data-aspect="4:3">۴:۳</button><button class="chip" data-aspect="3:2">۳:۲</button><button class="chip" data-aspect="16:9">۱۶:۹</button></div>
        <div class="row rbs2"><button class="ibtn rb" data-act="rotr" data-ic="rotr" aria-label="چرخش به راست"></button><button class="ibtn rb" data-act="rotl" data-ic="rotl" aria-label="چرخش به چپ"></button><button class="ibtn rb" data-act="fliph" data-ic="fliph" aria-label="آینه افقی"></button><button class="ibtn rb" data-act="flipv" data-ic="flipv" aria-label="آینه عمودی"></button><button class="link" data-act="resetCrop">بازنشانی</button></div>
      </div>
      <div class="pane" data-pane="adj">
        <div class="sl"><label>روشنایی</label><input type="range" min="50" max="150" value="100" data-k="bright"><output data-v="bright">۰</output></div>
        <div class="sl"><label>کنتراست</label><input type="range" min="50" max="150" value="100" data-k="contrast"><output data-v="contrast">۰</output></div>
        <div class="sl"><label>اشباع</label><input type="range" min="0" max="200" value="100" data-k="sat"><output data-v="sat">۰</output></div>
      </div>
      <div class="pane" data-pane="fx">
        <div class="row scroll fxstrip" data-el="fxstrip"></div>
        <div class="sl fx-k"><label>شدت</label><input type="range" min="0" max="100" value="50" data-k="fxk"><output data-v="fxk">۵۰</output></div>
      </div>
      <div class="pane" data-pane="up">
        <div class="grid4"><button class="chip sel" data-up="0">خاموش</button><button class="chip" data-up="2">⁦2×⁩</button><button class="chip" data-up="3">⁦3×⁩</button><button class="chip" data-up="4">⁦4×⁩</button></div>
        <div class="ailine"><i></i><span data-el="upNote">هوش مصنوعی | جزئیات تازه می‌سازد</span></div>
      </div>
      <div class="pane" data-pane="out">
        <div class="fmts c3">
          <button class="fmt" data-ifmt="avif"><span class="site" data-ic="globe"></span><b>AVIF</b></button>
          <button class="fmt sel" data-ifmt="webp"><span class="site" data-ic="globe"></span><b>WebP</b><small class="rec">★</small></button>
          <button class="fmt" data-ifmt="jpg"><b>JPG</b></button>
        </div>
        <span class="ailine sm" data-el="fmtNote"></span>
        <div class="segc"><button class="chip sel" data-qm="smart">هوشمند</button><button class="chip" data-qm="lossless">بی‌افت</button><button class="chip" data-qm="manual">دستی</button></div>
        <div class="sl qm-manual-only"><label>کیفیت</label><input type="range" min="40" max="99" value="85" data-k="q"><output data-v="q">۸۵</output></div>
        <div class="row scroll" data-el="resSec"><button class="chip sel" data-res="0">اصلی</button><button class="chip" data-res="480">480p</button><button class="chip" data-res="720">720p</button><button class="chip" data-res="1080">1080p</button><button class="chip" data-res="1440">2K</button><button class="chip" data-res="2160">4K</button></div>
      </div>
    </div>
    <nav class="tabs"><button class="tab sel" data-tab="crop" data-title="برش و چرخش"><span data-ic="crop"></span>برش</button><button class="tab" data-tab="adj" data-title="نور و رنگ"><span data-ic="drop"></span>رنگ</button><button class="tab" data-tab="fx" data-title="افکت"><span data-ic="wand"></span>افکت</button><button class="tab" data-tab="up" data-title="ارتقا با هوش مصنوعی"><span data-ic="up"></span>ارتقا</button><button class="tab" data-tab="out" data-title="خروجی"><span data-ic="out"></span>خروجی</button><button class="g2" data-act="export"><span data-ic="spark"></span>ساخت<span class="sr" data-el="expLbl">ساخت WebP</span></button></nav>
  </div>
</section>

<!-- video editor -->
<section class="scr ed" id="edVid" data-kind="vid" data-tool="crop">
  <div class="topo"><button class="ibtn glass bk" data-back data-ic="back" aria-label="بازگشت"></button><div class="fileline glass"><b data-el="name"></b><small data-el="infoS"></small></div><button class="ibtn glass bk" data-repick data-ic="open" aria-label="ویدیوی دیگر"></button></div>
  <div class="stage" data-el="stage"><div class="frame" data-el="frame"><video data-el="video" muted playsinline></video><canvas class="fxcv" data-el="fxcv" hidden></canvas><div class="crop" data-el="crop"></div></div></div>
  <div class="ctl glass">
    <div class="ch"><b class="ch-t"><span class="ch-n">کادر</span><small class="only-fx" data-el="fxName">بدون افکت</small><small class="only-time"><span data-el="tA">—</span> تا <span data-el="tB">—</span></small></b><span class="ch-e"><em data-el="outSize">—</em><span class="only-out"> | <span data-el="dPct"></span></span> | <span class="tm" data-el="eta"><i>—</i></span></span></div>
    <div class="panel">
      <div class="pane on" data-pane="crop">
        <div class="row scroll"><button class="chip sel" data-aspect="free">آزاد</button><button class="chip" data-aspect="orig">اصلی</button><button class="chip" data-aspect="1:1">۱:۱</button><button class="chip" data-aspect="4:5">۴:۵</button><button class="chip" data-aspect="9:16">۹:۱۶</button><button class="chip" data-aspect="4:3">۴:۳</button><button class="chip" data-aspect="3:2">۳:۲</button><button class="chip" data-aspect="16:9">۱۶:۹</button></div>
        <div class="row"><span class="note"><span class="dot"></span>گوشه‌های کادر را بکشید</span><button class="link push" data-act="resetCrop">کل کادر</button></div>
      </div>
      <div class="pane" data-pane="time">
        <div class="trim" data-el="trim"></div>
        <div class="row tr"><button class="ibtn rb" data-act="stepB" data-ic="prev" aria-label="فریم عقب"></button><button class="ibtn rb play" data-act="play" aria-label="پخش"><span class="i-play" data-ic="play"></span><span class="i-pause" data-ic="pause"></span></button><button class="ibtn rb" data-act="stepF" data-ic="next" aria-label="فریم جلو"></button>
          <span class="spd"><button class="chip" data-speed="0.5">۰٫۵×</button><button class="chip sel" data-speed="1">۱×</button><button class="chip" data-speed="1.5">۱٫۵×</button><button class="chip" data-speed="2">۲×</button></span></div>
        <div class="row even3"><button class="pill" data-act="setA"><span data-ic="start"></span>شروع اینجا</button><button class="pill" data-act="resetTrim">کل ویدیو</button><button class="pill" data-act="setB"><span data-ic="end"></span>پایان اینجا</button></div>
      </div>
      <div class="pane" data-pane="fx">
        <div class="row scroll fxstrip" data-el="fxstrip"></div>
        <div class="sl fx-k"><label>شدت</label><input type="range" min="0" max="100" value="50" data-k="fxk"><output data-v="fxk">۵۰</output></div>
      </div>
      <div class="pane" data-pane="out">
        <div class="fmts c4">
          <button class="fmt sel" data-fmt="mp4"><span class="site" data-ic="globe"></span><b>MP4</b><small class="rec">★</small></button>
          <button class="fmt" data-fmt="webm"><span class="site" data-ic="globe"></span><b>WebM</b></button>
          <button class="fmt" data-fmt="webp"><span class="site" data-ic="globe"></span><b>WebP</b><small>متحرک</small></button>
          <button class="fmt" data-fmt="gif"><b>GIF</b></button>
        </div>
        <div class="row"><button class="chip sel" data-act="sound" aria-pressed="true"><span data-ic="sound"></span>با صدا</button><button class="chip sel" data-act="loop" aria-pressed="true"><span data-ic="loop"></span>تکرار</button><span class="ailine sm" data-el="fmtNote"></span><span class="frm push" data-el="frames">—</span></div>
        <div class="row scroll" data-el="resSec"><span class="rl">وضوح</span><button class="chip" data-res="360">360p</button><button class="chip sel" data-res="480">480p</button><button class="chip" data-res="720">720p</button><button class="chip" data-res="1080">1080p</button><button class="chip" data-res="0">اصلی</button></div>
        <div class="row scroll"><span class="rl">کیفیت</span><button class="chip" data-gq="best">عالی</button><button class="chip sel" data-gq="balanced">متعادل</button><button class="chip" data-gq="small">کم‌حجم</button><i class="sep"></i><span class="rl">فریم</span><span class="row tight" data-el="fpsBox"></span></div>
      </div>
    </div>
    <nav class="tabs"><button class="tab sel" data-tab="crop" data-title="کادر"><span data-ic="crop"></span>کادر</button><button class="tab" data-tab="time" data-title="زمان"><span data-ic="clock"></span>زمان</button><button class="tab" data-tab="fx" data-title="افکت"><span data-ic="wand"></span>افکت</button><button class="tab" data-tab="out" data-title="خروجی"><span data-ic="out"></span>خروجی</button><button class="g2" data-act="export"><span data-ic="spark"></span>ساخت<span class="sr" data-el="expLbl">ساخت MP4</span></button></nav>
  </div>
</section>

<!-- result -->
<section class="scr" id="res">
  <div class="res-prev stage" id="resPrev"><img id="resImg" alt=""><video id="resVid" controls playsinline hidden></video><div class="cmpv" id="cmpv" hidden></div></div>
  <div class="res-head glass"><b class="bar-t" id="resTitle">نتیجه</b><i class="sepv"></i><span class="status ok" id="resStat">آماده</span></div>
  <div class="res-info glass" id="resInfoBox" hidden><div class="ri-h"><b>جزئیات فایل</b><button class="ibtn rb x" id="resInfoX" data-ic="close" aria-label="بستن"></button></div><div class="cmpt" id="resTable"></div></div>
  <div class="res-acts fbar glass"><button class="fb" data-back><span data-ic="back"></span>بازگشت</button><button class="fb" id="resInfo"><span data-ic="info"></span>جزئیات</button><button class="fb" id="resShare"><span data-ic="share"></span>اشتراک</button><button class="fb gold" id="resSave"><span data-ic="save"></span>ذخیره در گالری</button></div>
</section>

<div class="busy kb" id="busy"><div class="amb"></div><div class="kb-in glass"><div class="kb-t"><span id="busyT">لطفاً صبر کنید</span><small id="busyM" hidden></small></div><svg viewBox="0 0 220 150" aria-hidden="true">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d1"/><stop offset=".5" stop-color="#f1cb83"/><stop offset="1" stop-color="#c99e4c"/></linearGradient>
      <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8b5"/><stop offset="1" stop-color="#d9ad5c"/></linearGradient></defs>
    <ellipse id="shadow" cx="139" cy="134" rx="40" ry="4" fill="#000"/>
    <circle class="sp a" cx="132" cy="98" r="3.4" fill="#f1cb83"/><circle class="sp b" cx="146" cy="98" r="2.6" fill="#fff3d1"/><circle class="sp c" cx="124" cy="100" r="2.2" fill="#d4b06a"/><circle class="sp d" cx="152" cy="99" r="2" fill="#f1cb83"/>
    <g id="pan">
      <circle id="cake" cx="139" cy="102" r="23" fill="url(#gc)"/>
      <path d="M94 106 H184 Q182 122 166 123 H112 Q96 122 94 106 Z" fill="url(#gg)"/>
      <path d="M96 108 Q72 100 46 104" fill="none" stroke="url(#gg)" stroke-width="5.5" stroke-linecap="round"/>
    </g>
  </svg><div class="kb-p goldtxt" id="ringP">۰٪</div><div class="kb-bar" id="ring"><i></i></div><div class="kb-s" id="busyS" hidden><span class="dot"></span><span id="busySt"></span></div><button class="pill" id="busyX" hidden><span data-ic="close"></span>لغو</button></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fVid" accept="video/*" hidden>
<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/awebp.js"></script>
<script src="js/demux.js"></script>
<script src="js/media.js"></script>
<script src="js/upscale.js"></script>
<script src="js/compare.js"></script>
<script src="js/editors.js"></script>
<script src="js/ui.js"></script>
<script src="js/mob.js"></script>
</body>
</html>
